name: Deploy FarmerAssist Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get
        working-directory: farmer_assit

      - name: 🌐 Build Flutter Web
        run: |
          flutter build web --release --base-href "/FarmerAssit/" --dart-define=API_BASE_URL=https://farmerassit-backend.onrender.com
        working-directory: farmer_assit

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: farmer_assit/build/web
          branch: gh-pages
