services:
  - type: web
    name: farmerassist-backend
    runtime: docker
    dockerfilePath: ./farmerassist-backend/Dockerfile
    dockerContext: ./farmerassist-backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AGMARKNET_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
