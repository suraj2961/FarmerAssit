spring.application.name=farmerassist-backend
server.port=8080

agmarknet.api.base-url=https://api.data.gov.in
agmarknet.api.resource-id=9ef84268-d588-465a-a308-a864a43d0070
agmarknet.api.key=${AGMARKNET_API_KEY:YOUR_DATA_GOV_IN_API_KEY}

openweather.api.base-url=https://api.openweathermap.org
openweather.api.key=${OPENWEATHER_API_KEY:YOUR_OPENWEATHERMAP_API_KEY}

youtube.api.base-url=https://www.googleapis.com
youtube.api.key=${YOUTUBE_API_KEY:YOUR_YOUTUBE_API_KEY}

logging.level.com.farmerassist.backend=DEBUG

# Server Load Balancing & Performance Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,application/json,application/javascript,text/css
server.compression.min-response-size=1024