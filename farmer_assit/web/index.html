<!DOCTYPE html>
<html lang="kn">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ನೇಗಿಲು (Negilu) - Live Karnataka APMC mandi prices, ML crop sell advisory, real-time weather forecasts, and government schemes for farmers.">

  <!-- Preconnect to font and resource CDNs for fast loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ನೇಗಿಲು Negilu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ನೇಗಿಲು (Negilu) • FarmerAssist | Karnataka APMC & ML Advisory</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF6EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #FAF6EC 0%, #F0E5D6 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      background: #1C5A2C;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(28, 90, 44, 0.25);
    }
    .brand-icon svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      color: #1C5A2C;
      letter-spacing: -0.5px;
    }
    .brand-tag {
      background: #16A34A;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.8px;
      margin-left: 6px;
    }
    .brand-sub {
      font-size: 13px;
      color: #555555;
      font-weight: 500;
      margin-top: 2px;
    }
    .loader-bar {
      width: 220px;
      height: 4px;
      background: #DCE8DE;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #1C5A2C, #22C55E);
      border-radius: 4px;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    .loading-text {
      margin-top: 14px;
      font-size: 12.5px;
      color: #2E5A35;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="brand-box">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
        </svg>
      </div>
      <div>
        <div style="display: flex; align-items: center;">
          <span class="brand-title">ನೇಗಿಲು</span>
          <span class="brand-tag">KRISHI</span>
        </div>
        <div class="brand-sub">FarmerAssist • ಕೃಷಿ ಪೋರ್ಟಲ್</div>
      </div>
    </div>
    <div class="loader-bar">
      <div class="loader-bar-fill"></div>
    </div>
    <div class="loading-text">ಮಾರುಕಟ್ಟೆ ಮತ್ತು ಹವಾಮಾನ ಡೇಟಾ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
  </div>

  <script>
    // Smoothly dismiss loader when Flutter is mounted
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
